# Server port
server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://puras.ru:5432/taskplanner
spring.datasource.username=postgres
spring.datasource.password=4455qq66

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT secret and expiration (86400000 ms = 24 hours)
jwt.secret=mySecretKeyForJWTShouldBeLongAndSecureAtLeast256Bits
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.levon.taskplanner=DEBUG

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs