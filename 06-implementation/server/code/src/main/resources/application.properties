# Server port
server.port=8080

# PostgreSQL connection — значения берутся из переменных окружения (Railway / локальный .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskplanner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT secret and expiration (86400000 ms = 24 hours)
jwt.secret=${JWT_SECRET:changeThisToALongRandomSecretKeyAtLeast32Characters}
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.levon.taskplanner=INFO

# Jackson: serialize Java 8 dates as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
